<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.1, maximum-scale=4.0">
    <title>Prévisions</title>
    <link rel="stylesheet" href="https://phbretier.github.io/byza/style.css">
    <script src="https://phbretier.github.io/byza/script.js"></script>
    <script>
        const [nom, lat, lon] = window.location.hash.substring(1).split("/");
        document.title = `MétéoBlue ${nom}`;
    </script>
</head>
<body>
    <div class="section">
        <script> document.write(`Prévisions MétéoBlue pour - ${nom} - (${lat},${lon})`); </script>
    </div>
    <br>
    <script>
        const items = [
          ['Météogram', ''],
          ['Météogram Air', '_air'],
          ['Météogram Thermal', '_thermal'],
          ['Météogram Multimodel', '_multimodel'],
          ['Météogram Wind', '_wind'],
          ['Météogram Stueve', '_stueve'],
          ['Météogram Sounding', '_sounding']
        ];
        
        items.forEach(([label, suffix]) => {
          const name = `${label} ${nom}`;
          const url = `https://my.meteoblue.com/images/meteogram${suffix}?lat=${lat}&lon=${lon}&asl=73&tz=Europe%2FParis&apikey=taIbwrSiUgM1FTvK&format=png&dpi=72&lang=fr&temperature_units=C&precipitation_units=mm&windspeed_units=kmh&location_name=${encodeURIComponent(name)}`;
            
          document.write(`
            <div style="height: 20px;"></div>
            <div class="section" style="display: flex; justify-content: center;">${label}</div>
            <br>
            <img src="${url}" alt="${name}" width="100%"/>
            <br>
          `);
        });
    </script>
</body>
</html>
