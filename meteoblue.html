<!DOCTYPE html>
<html>
<head>
    <title>MétéoBlue</title>
    <script src="https://phbretier.github.io/byza/script.js"></script>
    <script>
        const [nom, lat, lon] = window.location.hash.substring(1).split("/");
        const lieu = decodeURIComponent(nom).trim();
        document.title = `MétéoBlue ${lieu}`;
    </script>
</head>
<body>
    <script>
        document.write(`
            <div class="section" style="display: flex; justify-content: center;"> 
                Prévisions MétéoBlue pour - ${lieu} - (${lat},${lon})
            </div>
            <br>
        `);
        
        const items = [
            ['Météogram', ''],
            ['Météogram Air', '_air'],
            ['Météogram Thermal', '_thermal'],
            ['Météogram Multimodel', '_multimodel'],
            ['Météogram Wind', '_multimodelwind'],
            ['Météogram Stueve', '_stueve'],
            ['Météogram Sounding', '_sounding']
        ];
        
        items.forEach(([label, suffix]) => {
            const name = `${label} ${lieu}`;
            const url = `https://my.meteoblue.com/images/meteogram${suffix}?lat=${lat}&lon=${lon}&asl=73&tz=Europe%2FParis&apikey=taIbwrSiUgM1FTvK&format=png&dpi=72&lang=fr&temperature_units=C&precipitation_units=mm&windspeed_units=kmh&location_name=${encodeURIComponent(lieu)}`;
            var menu = `
                <div class="section" style="display: flex; justify-content: center; " id="${encodeURIComponent(label)}">${label}</div> 
                <div style="display: flex; justify-content: center; font-size: smaller;">
            `;
            items.forEach(([label2, suffix2]) => {
                if (label != label2) {
                    const mots = label2.split(" ");
                    menu += `&ensp; <a href="#${encodeURIComponent(label2)}">${mots[mots.length - 1]}</a> `;
                }
            });
            menu += "&ensp; </div>";
            document.write(`
                <div style="height: 20px;"></div>
                ${menu}
                <br>
                <img src="${url}" alt="${name}" width="100%"/>
                <br>
            `);
        });
    </script>
</body>
</html>
